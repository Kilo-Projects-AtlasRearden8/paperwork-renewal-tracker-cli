[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperwork-renewal-tracker"
version = "1.0.0"
description = "Local-first CLI to track document renewals (licenses, registration, insurance, passports) with due-date alerts and CSV export."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = [
    "cli",
    "documents",
    "renewals",
    "tracker",
    "licenses",
    "insurance",
    "passport",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business",
]

[project.scripts]
paperwork-tracker = "paperwork_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["paperwork_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
